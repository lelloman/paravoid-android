pluginManagement {
    includeBuild('paravoid-gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'paravoid-android'
include ':paravoid-api', ':paravoid-runtime', ':sample-app', ':sample-library'
include ':paravoid-contract'
includeBuild('paravoid-hilt')
includeBuild('paravoid-work')
