plugins {
    id 'groovy'
    id 'java-gradle-plugin'
}
group = 'com.lelloman.paravoid'
version = '0.1.0-dev'
repositories { google(); mavenCentral() }
dependencies {
    implementation 'com.android.tools.build:gradle:8.13.2'
    implementation 'com.android.tools.build:aapt2-proto:8.13.2-14304508'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    implementation 'org.ow2.asm:asm-commons:9.7'
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.named('test') {
    systemProperty 'paravoid.repo', rootProject.projectDir.parentFile.absolutePath
    systemProperty 'paravoid.gradleUserHome', gradle.gradleUserHomeDir.absolutePath
}
gradlePlugin {
    plugins {
        paravoidApplication {
            id = 'com.lelloman.paravoid'
            implementationClass = 'com.lelloman.paravoidandroid.gradle.ParavoidApplicationPlugin'
        }
        paravoidModule {
            id = 'com.lelloman.paravoid.module'
            implementationClass = 'com.lelloman.paravoidandroid.gradle.ParavoidModulePlugin'
        }
        paravoidShell {
            id = 'com.lelloman.paravoid.shell'
            implementationClass = 'com.lelloman.paravoidandroid.gradle.ParavoidShellPlugin'
        }
    }
}
