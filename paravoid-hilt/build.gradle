plugins {
    id 'groovy'
    id 'java-gradle-plugin'
}
group = 'com.lelloman.paravoid'
apply from: '../gradle/local-publication.gradle'
repositories { google(); mavenCentral() }
configurations { hiltTestPlugin { extendsFrom implementation, runtimeOnly } }
dependencies {
    implementation "${project.group}:paravoid-gradle-plugin:${project.version}"
    implementation 'org.ow2.asm:asm:9.7'
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
    hiltTestPlugin 'com.google.dagger:hilt-android-gradle-plugin:2.57.2'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
tasks.named('test') {
    systemProperty 'paravoid.repo', rootProject.projectDir.parentFile.absolutePath
    systemProperty 'paravoid.gradleUserHome', gradle.gradleUserHomeDir.absolutePath
}
// TestKit must load Hilt and AGP alongside the injected plugin, just as a consumer
// plugins block does. This configuration is not part of the published runtime.
tasks.named('pluginUnderTestMetadata') {
    // Resolve one graph so shared tooling (e.g. JavaPoet) has one selected version.
    pluginClasspath.setFrom(sourceSets.main.output, configurations.hiltTestPlugin)
}
gradlePlugin {
    plugins {
        paravoidHilt {
            id = 'com.lelloman.paravoid.hilt'
            implementationClass = 'com.lelloman.paravoidandroid.hilt.gradle.ParavoidHiltPlugin'
        }
    }
}
