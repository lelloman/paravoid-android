plugins { id 'java-library' }

group = 'com.lelloman.paravoid'
apply from: '../gradle/local-publication.gradle'
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
publishing { publications { library(MavenPublication) { from components.java } } }
dependencies { testImplementation 'junit:junit:4.13.2' }

tasks.register('generateMetadataVectors', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lelloman.paravoidandroid.contract.MetadataVectorGenerator'
    args layout.buildDirectory.dir('metadata-vectors').get().asFile.absolutePath
}
