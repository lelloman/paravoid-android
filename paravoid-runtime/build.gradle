plugins { id 'com.android.library' }
apply from: '../gradle/local-publication.gradle'
android {
    namespace 'com.lelloman.paravoidandroid.runtime'
    compileSdk 36
    publishing { singleVariant('release') { withSourcesJar() } }
    sourceSets.main.java.srcDirs('../delivery/src', '../delivery/android/src')
    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    api project(':paravoid-api')
    api project(':paravoid-update-api')
    api project(':paravoid-recovery-api')
    implementation project(':paravoid-contract')
    testImplementation 'junit:junit:4.13.2'
}
afterEvaluate { publishing.publications.create('release', MavenPublication) { from components.release } }
