// Local staging only. Remote repositories/credentials are deliberately not configured.
apply plugin: 'maven-publish'
group = providers.gradleProperty('paravoidGroup').getOrElse('com.lelloman.paravoid')
version = providers.gradleProperty('paravoidVersion').getOrElse('0.1.0-dev')
def releaseLicenseName = providers.gradleProperty('paravoidLicenseName').orNull
def releaseLicenseUrl = providers.gradleProperty('paravoidLicenseUrl').orNull
if ((releaseLicenseName == null) != (releaseLicenseUrl == null)) {
    throw new GradleException('Supply both paravoidLicenseName and paravoidLicenseUrl, or neither for development staging.')
}

publishing {
    repositories {
        maven {
            name = 'LocalStaging'
            url = uri(providers.gradleProperty('paravoidRepository').getOrElse(
                layout.buildDirectory.dir('local-repository').get().asFile.absolutePath))
            if (url.scheme != 'file') throw new GradleException('Local staging requires a file repository, not a remote URL.')
        }
    }
    publications.withType(MavenPublication).configureEach {
        pom {
            name = project.name
            description = 'Paravoid Android shell and signed application payload tooling'
            url = 'https://github.com/lelloman/paravoid-android'
            scm {
                url = 'https://github.com/lelloman/paravoid-android'
                connection = 'scm:git:https://github.com/lelloman/paravoid-android.git'
            }
            // Explicit owner-approved metadata only; development staging has no default license.
            if (releaseLicenseName != null) {
                licenses { license { name = releaseLicenseName; url = releaseLicenseUrl } }
            }
        }
    }
}
