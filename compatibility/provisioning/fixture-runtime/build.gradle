plugins { id 'com.android.library' }
android {
    namespace 'com.lelloman.paravoidandroid.runtime'
    compileSdk 36
    defaultConfig { minSdk 30 }
    sourceSets.main.java.srcDir '../../../paravoid-runtime/src/main/java'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies { api project(':paravoid-api') }
