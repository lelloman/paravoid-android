plugins { id 'com.lelloman.paravoid' }

android {
    namespace 'com.lelloman.paravoidcompat.minification'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.minification'
        minSdk 28
        targetSdk 36
        versionCode providers.gradleProperty('probeVersion').map { it.toInteger() }.getOrElse(1)
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

paravoid {
    minifyPayload = providers.gradleProperty('minifyPayload').map { it.toBoolean() }.orElse(false)
    payloadProguardFiles.from(layout.projectDirectory.file('payload-rules.pro'))
}

dependencies {
    implementation project(':paravoid-runtime')
    implementation project(':consumer-library')
    implementation project(':jar-library')
}
