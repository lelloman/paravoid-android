pluginManagement {
    includeBuild('../../paravoid-gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'resources-compatibility'
include ':paravoid-api', ':paravoid-runtime'
project(':paravoid-api').projectDir = file('../../paravoid-api')
include ':paravoid-contract'
project(':paravoid-contract').projectDir = file('../../paravoid-contract')
project(':paravoid-runtime').projectDir = file('../../paravoid-runtime')
