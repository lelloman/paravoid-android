plugins {
    id 'com.lelloman.paravoid'
    id 'com.lelloman.paravoid.work' apply false
}
def configured = providers.gradleProperty('configuredWork').isPresent()
if ((configured || providers.gradleProperty('workProbeEnableIntegration').isPresent())
        && !providers.gradleProperty('workProbeDisableIntegration').isPresent()) {
    apply plugin: 'com.lelloman.paravoid.work'
}
android {
    namespace 'com.lelloman.paravoidcompat.storage'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.storage' + (configured ? '.configured' : '')
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    if (configured) {
        sourceSets.main.java.srcDir 'src/configured/java'
        sourceSets.main.manifest.srcFile 'src/configured/AndroidManifest.xml'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix '.paravoid' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':paravoid-runtime')
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.10.1'
}
