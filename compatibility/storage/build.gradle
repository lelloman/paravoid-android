plugins { id 'com.lelloman.paravoid' }
android {
    namespace 'com.lelloman.paravoidcompat.storage'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.storage'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix '.paravoid' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation project(':paravoid-runtime')
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.10.1'
}
