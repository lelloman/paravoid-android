plugins {
    id 'com.lelloman.paravoid'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'com.google.devtools.ksp' version '2.2.21-2.0.4'
}
android {
    namespace 'com.lelloman.paravoidcompat.network'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.network'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix '.paravoid' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    implementation project(':paravoid-runtime')
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.2'
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
