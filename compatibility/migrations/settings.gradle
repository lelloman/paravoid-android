pluginManagement {
    includeBuild('../../paravoid-gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'migration-compatibility'
include ':paravoid-api', ':paravoid-runtime'
project(':paravoid-api').projectDir = file('../../paravoid-api')
// Only this experiment substitutes the bundle-selection hook; production is untouched.
project(':paravoid-runtime').projectDir = file('fixture-runtime')
