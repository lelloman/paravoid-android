pluginManagement {
    includeBuild('../../paravoid-gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = 'local-triggers'
include ':paravoid-api'
project(':paravoid-api').projectDir = file('../../paravoid-api')
include ':paravoid-contract'
project(':paravoid-contract').projectDir = file('../../paravoid-contract')
include ':paravoid-runtime'
project(':paravoid-runtime').projectDir = file('../../paravoid-runtime')
include ':paravoid-recovery-api'
project(':paravoid-recovery-api').projectDir = file('../../paravoid-recovery-api')
include ':paravoid-update-api'
project(':paravoid-update-api').projectDir = file('../../paravoid-update-api')
include ':paravoid-update-ipc'
project(':paravoid-update-ipc').projectDir = file('../../paravoid-update-ipc')
