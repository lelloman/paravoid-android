plugins { id 'com.lelloman.paravoid' }
android {
    if (providers.gradleProperty('httpsAcceptance').present) {
        signingConfigs {
            acceptance {
                storeFile file('build/keys/acceptance.p12')
                storePassword 'fixture-only'; keyAlias 'fixture'; keyPassword 'fixture-only'
            }
        }
        buildTypes.release { signingConfig signingConfigs.acceptance; debuggable false }
        sourceSets.release.manifest.srcFile 'src/httpsAcceptance/AndroidManifest.xml'
        sourceSets.release.res.srcDirs 'src/httpsAcceptance/res', 'build/https-res'
    }
    if (providers.gradleProperty('sharedUidProbe').present) {
        sourceSets.debug.manifest.srcFile 'src/shared-uid/AndroidManifest.xml'
    }
    sourceSets.main.assets.srcDir 'build/pressure-assets'
    namespace 'com.lelloman.paravoidcompat.complete'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.complete'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'STARTUP_FAULT', '"' + providers.gradleProperty('startupFault').getOrElse('none') + '"'
        resValue 'string', 'generation', providers.gradleProperty('generation').getOrElse('A')
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
paravoid {
    packaging = 'complete'
    controlsLauncher = true // Exercise the optional recovery launcher in the fixture.
    minifyPayload = providers.gradleProperty('minifyPayload').map { it.toBoolean() }.orElse(false)
    payloadProguardFiles.from(layout.projectDirectory.file('payload-rules.pro'))
    bootstrap = providers.gradleProperty('bootstrap').getOrElse('embedded')
    payloadVersion = providers.gradleProperty('payloadVersion').map { Long.valueOf(it) }.getOrElse(1L)
    if (providers.gradleProperty('baseline').present) baselineDirectory = layout.projectDirectory.dir('build/accepted')
    updates {
        enabled = true
        baseUrl = providers.gradleProperty('httpsAcceptance').present ? 'https://127.0.0.1:18765/' : 'http://127.0.0.1:18765/'
        debugHttpAllowed = !providers.gradleProperty('httpsAcceptance').present
        authentication = providers.gradleProperty('authentication').getOrElse('public')
        trustPolicyFile = layout.projectDirectory.file('build/keys/trust.json')
    }
    signing { keyId = 'release'; privateKeyFile = layout.projectDirectory.file('build/keys/release.der') }
}
dependencies {
    implementation project(':paravoid-runtime')
    implementation project(':native-probe')
}
