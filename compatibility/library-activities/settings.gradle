pluginManagement {
    includeBuild('../../paravoid-gradle-plugin')
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google(); mavenCentral()
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroup('com.github.lelloman.androidoscopy') }
        }
    }
}
rootProject.name = 'library-activities'
include ':paravoid-api', ':paravoid-runtime'
project(':paravoid-api').projectDir = file('../../paravoid-api')
project(':paravoid-runtime').projectDir = file('../../paravoid-runtime')
