plugins { id 'com.android.library' }
android {
    namespace 'com.lelloman.paravoidcompat.jni.bridge'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        minSdk 28
        ndk { abiFilters.addAll(providers.gradleProperty('probeAbis').getOrElse('x86_64,arm64-v8a').split(',').toList()) }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
