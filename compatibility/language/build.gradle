plugins {
    id 'com.lelloman.paravoid'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.2.21'
}
android {
    namespace 'com.lelloman.paravoidcompat.language'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lelloman.paravoidcompat.language'
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    productFlavors {
        normal { applicationIdSuffix '.normal' }
        paravoidAndroid { applicationIdSuffix '.paravoid' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    implementation project(':paravoid-runtime')
    implementation project(':probe-library')
    implementation 'org.jetbrains.kotlin:kotlin-reflect:2.2.21'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
}
