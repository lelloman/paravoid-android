plugins { id 'com.android.library' }
apply from: '../gradle/local-publication.gradle'
android {
    namespace 'com.lelloman.paravoidandroid.api'
    compileSdk 36
    publishing { singleVariant('release') { withSourcesJar() } }
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
afterEvaluate { publishing.publications.create('release', MavenPublication) { from components.release } }
